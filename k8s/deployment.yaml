apiVersion: apps/v1
kind: Deployment
metadata:
  name: cca2-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cca2-app
  template:
    metadata:
      labels:
        app: cca2-app
    spec:
      containers:
        - name: cca2-app
          image: DOCKER_IMAGE_NAME
          ports:
            - containerPort: 3000
