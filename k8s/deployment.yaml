apiVersion: apps/v1
kind: Deployment
metadata:
  name: cca2-app-deployment
  labels:
    app: cca2-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cca2-app
  template:
    metadata:
      labels:
        app: cca2-app
    spec:
      containers:
      - name: cca2-app-container
        image: prathamshelke331/
        cca2-cicd-pipeline:latest
        ports:
        - containerPort: 3000
